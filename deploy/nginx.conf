# ─────────────────────────────────────────────────────────────
#  UHID Platform — Nginx Configuration
#  Place in: /etc/nginx/sites-available/uhid
#  Symlink:  ln -s /etc/nginx/sites-available/uhid /etc/nginx/sites-enabled/
# ─────────────────────────────────────────────────────────────

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

upstream uhid_api {
    server 127.0.0.1:5001;
    keepalive 64;
}

upstream uhid_ai {
    server 127.0.0.1:8001;
    keepalive 16;
}

# ─── HTTP → HTTPS redirect ───────────────────────────────────
server {
    listen 80;
    server_name uhid.yourdomain.com;
    return 301 https://$host$request_uri;
}

# ─── Main HTTPS server ───────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name uhid.yourdomain.com;

    # SSL (use certbot/Let's Encrypt)
    ssl_certificate     /etc/letsencrypt/live/uhid.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/uhid.yourdomain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # ─── Frontend (Vite build) ────────────────────────────────
    root /var/www/uhid/apps/web/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;

        # Cache static assets aggressively
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # ─── API Proxy ────────────────────────────────────────────
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://uhid_api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # File upload size (medical records up to 10MB)
        client_max_body_size 10M;
    }

    # ─── Auth endpoints (stricter rate limit) ─────────────────
    location /api/auth/login {
        limit_req zone=auth_limit burst=3 nodelay;
        proxy_pass http://uhid_api/auth/login;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/auth/register {
        limit_req zone=auth_limit burst=2 nodelay;
        proxy_pass http://uhid_api/auth/register;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ─── WebSocket (Socket.io) ────────────────────────────────
    location /socket.io/ {
        proxy_pass http://uhid_api/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ─── AI Service Proxy ─────────────────────────────────────
    location /ai/ {
        limit_req zone=api_limit burst=5 nodelay;
        proxy_pass http://uhid_ai/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;  # AI operations can be slow
    }

    # ─── Health check ─────────────────────────────────────────
    location /health {
        proxy_pass http://uhid_api/health;
        access_log off;
    }
}
